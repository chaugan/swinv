# nfpm configuration for the swinv .deb and .rpm packages.
#
# Build both with:  make packages
# (which is `nfpm package -f packaging/nfpm.yaml -p deb|rpm -t dist/`)
#
# swinv is a statically linked CGO_ENABLED=0 binary, so the packages declare no
# runtime dependencies at all — that is the whole point of the distribution
# model. Do not add any without a reason that survives `ldd bin/swinv`.

name: swinv
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "1"
section: admin
priority: optional
maintainer: "The swinv Authors"
description: |
  Local software inventory collector.
  swinv scans the Linux host it runs on, enumerates installed software (OS
  packages, language-ecosystem packages, and loose binaries that no package
  manager installed), and writes the result to local JSON and CSV files.
  There is no server, no daemon and no network transmission: collecting the
  files afterwards is left to rsync, Ansible, a log shipper or scp.
vendor: "The swinv Authors"
homepage: "https://github.com/chaugan/swinv"
license: "Apache-2.0"

contents:
  - src: ./bin/swinv
    dst: /usr/bin/swinv
    file_info:
      mode: 0755

  # Units are shipped but deliberately NOT enabled on install. Turning on a
  # daily filesystem-wide scan without being asked would be rude.
  - src: ./packaging/swinv.service
    dst: /usr/lib/systemd/system/swinv.service
    file_info:
      mode: 0644
  - src: ./packaging/swinv.timer
    dst: /usr/lib/systemd/system/swinv.timer
    file_info:
      mode: 0644

  - src: ./dist/man/swinv.8.gz
    dst: /usr/share/man/man8/swinv.8.gz
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/swinv/README.md
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/swinv/LICENSE
    file_info:
      mode: 0644
  - src: ./NOTICE
    dst: /usr/share/doc/swinv/NOTICE
    file_info:
      mode: 0644
  - src: ./AUTHORS
    dst: /usr/share/doc/swinv/AUTHORS
    file_info:
      mode: 0644
  - src: ./THIRD_PARTY_LICENSES.md
    dst: /usr/share/doc/swinv/THIRD_PARTY_LICENSES.md
    file_info:
      mode: 0644

  # The default --out directory. Owned by the package so it is removed on purge
  # but its contents are treated as data, not configuration.
  - dst: /var/lib/swinv
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh

deb:
  fields:
    Bugs: "https://github.com/chaugan/swinv/issues"

rpm:
  group: Applications/System
  summary: Local software inventory collector

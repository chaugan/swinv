# CI for swinv.
#
# Four gates, all of which must pass:
#   build     CGO_ENABLED=0 build + vet + race tests, and proof the shipped
#             binary is statically linked (a primary product requirement)
#   lint      golangci-lint
#   licences  no GPL / AGPL / LGPL / unknown dependency (spec section 3)
#   units     the systemd unit files parse
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Syft v1.51.0 declares go >= 1.26.3; an older toolchain fails with
  # 'unrecognized import path "golang.org/toolchain"'. Pin exactly.
  GO_VERSION: "1.26.6"
  CGO_ENABLED: "0"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # `make build` stamps the version from `git describe`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Report toolchain
        run: |
          go version
          go env GOVERSION GOOS GOARCH CGO_ENABLED

      - name: Verify module checksums
        run: go mod verify

      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        # The race detector needs cgo, so it is enabled for this step only.
        # It never applies to the shipped binary, which is built above and
        # again in the static-linkage check below with CGO_ENABLED=0.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Build release binary
        run: make build

      - name: Assert the binary is statically linked
        run: |
          set -u
          echo "--- file ---"
          file bin/swinv
          echo "--- ldd ---"
          # ldd exits non-zero for a non-dynamic executable, so capture the
          # output rather than relying on the exit status.
          out="$(ldd bin/swinv 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*)
              echo "OK: bin/swinv is statically linked"
              ;;
            *)
              echo "FAIL: bin/swinv is dynamically linked; the single-binary" >&2
              echo "      requirement (spec section 2) is broken." >&2
              exit 1
              ;;
          esac

      - name: Smoke-test the binary
        run: |
          ./bin/swinv --version
          ./bin/swinv --help 2>&1 | head -40 || true

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: swinv-linux-amd64
          path: bin/swinv
          if-no-files-found: error
          retention-days: 7

  cross-distro:
    name: cross-distro package catalogers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the static binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/swinv ./cmd/swinv

      # Each distribution's own tooling is the oracle. A Syft upgrade that
      # quietly stops reading one package database shows up here as a count
      # mismatch rather than as a silently thinner inventory months later.
      - name: Compare against each distribution's package manager
        run: |
          set -u
          fail=0
          check() {
            local name="$1" image="$2" nativecmd="$3"
            local native swinv
            native=$(docker run --rm "$image" sh -c "$nativecmd" 2>/dev/null | tr -d '[:space:]')
            if ! docker run --rm -v /tmp/swinv:/swinv:ro -v /tmp/out:/out "$image" \
                 /swinv --root / --out /out --quiet --format json --offline \
                 --catalogers os --name "$name" >/dev/null 2>&1; then
              echo "::error::$name: swinv failed to run"; fail=1; return
            fi
            swinv=$(python3 -c "import json;print(len(json.load(open('/tmp/out/$name.json'))['components']))")
            if [ "$native" = "$swinv" ]; then
              echo "  $name: $swinv == $native"
            else
              echo "::error::$name: swinv found $swinv, $image reports $native"
              fail=1
            fi
          }
          mkdir -p /tmp/out
          check alpine    alpine:latest        'apk info 2>/dev/null | wc -l'
          check debian    debian:stable-slim   'dpkg-query -f ".\n" -W 2>/dev/null | wc -l'
          check fedora    fedora:latest        'rpm -qa 2>/dev/null | wc -l'
          check arch      archlinux:latest     'pacman -Q 2>/dev/null | wc -l'
          check opensuse  opensuse/tumbleweed  'rpm -qa 2>/dev/null | wc -l'
          exit $fail

  arm64-smoke:
    name: arm64 under emulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Register arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and run the arm64 binary
        run: |
          set -eu
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/swinv-arm64 ./cmd/swinv
          mkdir -p /tmp/out
          docker run --rm --platform linux/arm64 -v /tmp/swinv-arm64:/swinv:ro \
            alpine:latest /swinv --version
          # Not just --version: prove it actually catalogues on arm64.
          docker run --rm --platform linux/arm64 -v /tmp/swinv-arm64:/swinv:ro \
            -v /tmp/out:/out alpine:latest \
            /swinv --root / --out /out --quiet --format json --offline --catalogers os --name arm64
          native=$(docker run --rm --platform linux/arm64 alpine:latest sh -c 'apk info | wc -l' | tr -d '[:space:]')
          found=$(python3 -c "import json;print(len(json.load(open('/tmp/out/arm64.json'))['components']))")
          arch=$(python3 -c "import json;print(json.load(open('/tmp/out/arm64.json'))['host']['architecture'])")
          echo "  arm64: swinv=$found apk=$native arch=$arch"
          [ "$found" = "$native" ] || { echo "::error::arm64 count mismatch"; exit 1; }
          [ "$arch" = "arm64" ] || { echo "::error::architecture reported as $arch"; exit 1; }

  windows-cross:
    name: windows cross-compile (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # There is no Windows collector yet -- see docs/WINDOWS.md. This job
      # exists so the claim that docs makes, that the tree already builds for
      # Windows unchanged, keeps being true: a Linux-only syscall or an
      # unguarded /proc read fails here instead of surfacing months later when
      # someone starts the port.
      - name: Build and vet for windows/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -eu
          go vet ./...
          go build -trimpath \
            -ldflags "-s -w -X main.version=$(git describe --tags --always)-windows-experimental" \
            -o swinv.exe ./cmd/swinv
          ls -l swinv.exe

      # Published so the binary can be exercised on a real Windows machine to
      # establish a baseline. Deliberately a CI artifact and not a release
      # asset: on Windows this binary reports host facts it cannot determine
      # and applies none of the Linux exclusion model, so it is a measuring
      # instrument, not something anyone should install.
      - name: Upload the experimental binary
        uses: actions/upload-artifact@v7
        with:
          name: swinv-windows-amd64-experimental
          path: swinv.exe
          if-no-files-found: error
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

  licenses:
    name: licence gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Hard requirement from spec section 3: linking GPL/AGPL/LGPL code into
      # swinv would relicense the whole binary. This step is what stops the
      # licence position from drifting, so it must fail the build.
      - name: Fail on GPL / AGPL / LGPL / unknown dependencies
        run: make license-check

      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: make licenses

      - name: Fail if THIRD_PARTY_LICENSES.md is out of date
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md is stale." >&2
            echo "Run 'make licenses' and commit the result." >&2
            git --no-pager diff -- THIRD_PARTY_LICENSES.md >&2
            exit 1
          fi
          echo "OK: THIRD_PARTY_LICENSES.md is current"

      - name: Upload licence inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licence-inventory
          path: |
            bin/licenses.csv
            THIRD_PARTY_LICENSES.md
          if-no-files-found: ignore
          retention-days: 7

  packaging:
    name: systemd units
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Verify unit files
        run: |
          # systemd-analyze complains that the binary and the man page are not
          # installed on the runner; those messages are expected and filtered
          # out. Anything else is a real syntax error. The path is matched
          # loosely so a future move of the binary does not silently turn an
          # expected message into a CI failure.
          set -o pipefail
          out="$(systemd-analyze verify ./packaging/swinv.service ./packaging/swinv.timer 2>&1 || true)"
          echo "$out"
          filtered="$(printf '%s\n' "$out" \
            | grep -v 'is not executable: No such file or directory' \
            | grep -v "Command 'man swinv(8)' failed" \
            | grep -v 'has been removed and it is ignored' \
            | grep -v '^[[:space:]]*$' || true)"
          if [ -n "$filtered" ]; then
            echo "FAIL: systemd-analyze reported problems:" >&2
            printf '%s\n' "$filtered" >&2
            exit 1
          fi
          echo "OK: unit files verify cleanly"

      - name: Check the man page renders
        run: |
          set -eu
          # groff-base ships on the standard runner image, so do not reach for
          # apt unless it is genuinely missing. This step once hung for 21
          # minutes on "apt-get update" while unattended-upgrades held the dpkg
          # lock, and would have run to the 6-hour default without a timeout.
          if ! command -v groff >/dev/null 2>&1; then
            sudo apt-get update -qq -o DPkg::Lock::Timeout=120
            sudo apt-get install -y -qq -o DPkg::Lock::Timeout=120 groff-base
          fi
          # < /dev/null so a malformed macro can never leave groff waiting on
          # input; timeout so this step fails rather than stalls.
          timeout 60 groff -mandoc -Tutf8 packaging/swinv.8 > /dev/null < /dev/null
          echo "OK: packaging/swinv.8 renders"

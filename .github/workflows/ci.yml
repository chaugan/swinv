# CI for swinv.
#
# Four gates, all of which must pass:
#   build     CGO_ENABLED=0 build + vet + race tests, and proof the shipped
#             binary is statically linked (a primary product requirement)
#   lint      golangci-lint
#   licences  no GPL / AGPL / LGPL / unknown dependency (spec section 3)
#   units     the systemd unit files parse
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Syft v1.51.0 declares go >= 1.26.3; an older toolchain fails with
  # 'unrecognized import path "golang.org/toolchain"'. Pin exactly.
  GO_VERSION: "1.26.6"
  CGO_ENABLED: "0"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # `make build` stamps the version from `git describe`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Report toolchain
        run: |
          go version
          go env GOVERSION GOOS GOARCH CGO_ENABLED

      - name: Verify module checksums
        run: go mod verify

      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        # The race detector needs cgo, so it is enabled for this step only.
        # It never applies to the shipped binary, which is built above and
        # again in the static-linkage check below with CGO_ENABLED=0.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Build release binary
        run: make build

      - name: Assert the binary is statically linked
        run: |
          set -u
          echo "--- file ---"
          file bin/swinv
          echo "--- ldd ---"
          # ldd exits non-zero for a non-dynamic executable, so capture the
          # output rather than relying on the exit status.
          out="$(ldd bin/swinv 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*)
              echo "OK: bin/swinv is statically linked"
              ;;
            *)
              echo "FAIL: bin/swinv is dynamically linked; the single-binary" >&2
              echo "      requirement (spec section 2) is broken." >&2
              exit 1
              ;;
          esac

      - name: Smoke-test the binary
        run: |
          ./bin/swinv --version
          ./bin/swinv --help 2>&1 | head -40 || true

      - name: Assert the services block is collected and attributed
        # The join is from a listening executable to the package that installed
        # it, and it comes from the package databases' file lists rather than
        # from component.locations -- which record dpkg metadata files, never
        # /usr/sbin/sshd. That distinction is invisible in unit tests and was
        # wrong in the first implementation, where every daemon on a normal
        # server reported as unmanaged software. So this asserts against a
        # listener whose owning package is known: nc, from netcat-openbsd.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends netcat-openbsd
          setsid nc -l 127.0.0.1 39999 >/dev/null 2>&1 </dev/null &
          sleep 2

          # The scan has to run against / -- services describe the machine
          # that is running, not a tree on it -- so the runner's own bulk is
          # excluded by name instead. Without this the walk spends over
          # fourteen minutes in /usr/share/dotnet, /usr/local/lib/android and
          # friends, none of which this step is about. /usr/lib is kept: that
          # is where os-release lives, and losing it costs every PURL.
          run() {
            out="$1"; shift
            sudo ./bin/swinv --out "$out" --catalogers os --fast --timeout 6m \
              --format json,csv \
              --exclude './usr/local/**' --exclude './usr/share/**' \
              --exclude './usr/src/**' --exclude './usr/lib/jvm/**' \
              --exclude './opt/**' --exclude './snap/**' --exclude './mnt/**' \
              --exclude './imagegeneration/**' --exclude './var/cache/**' \
              --exclude './var/lib/docker/**' --exclude './var/lib/containers/**' "$@"
          }

          run /tmp/svc
          report="$(ls /tmp/svc/*.json | head -1)"

          echo "--- services ---"
          jq -r '.services[] | "\(.confidence)\t\((.endpoints // [])|join(","))\t\((.components // [])|join(","))"' "$report"

          test "$(jq -r .schema_version "$report")" = "1.7"

          # The listener we started, attributed to the deb that installed nc.
          owner="$(jq -r '.services[] | select((.endpoints // [])|join(",")|test("39999")) | (.components // [])[0]' "$report" | head -1)"
          case "$owner" in
            pkg:deb/*netcat-openbsd*) echo "OK: 127.0.0.1:39999 -> $owner" ;;
            *) echo "FAIL: the nc listener attributed to '$owner'," >&2
               echo "      want the netcat-openbsd package that owns nc.openbsd." >&2
               jq '.services[] | select((.endpoints // [])|join(",")|test("39999"))' "$report" >&2
               readlink /proc/"$(pgrep -n nc)"/exe >&2 || true
               grep -i 'nc\.openbsd' /var/lib/dpkg/info/netcat-openbsd.list >&2 || true
               exit 1 ;;
          esac

          # And it must be stated as a high-confidence finding with evidence,
          # not an unqualified claim.
          jq -e '.services[] | select((.endpoints // [])|join(",")|test("39999"))
                 | select(.confidence == "high") | select((.evidence|length) > 0)' "$report" >/dev/null

          # Syft's decoder -- what `grype sbom:` uses -- reads the distro only
          # from a components[] entry of type "operating-system". Without it
          # every deb and rpm arrives with no distro and matching falls back to
          # comparing backported versions against upstream numbering.
          run /tmp/svc-cdx --format cyclonedx-json
          cdx="$(ls /tmp/svc-cdx/*.cdx.json | head -1)"
          jq -e '.components[] | select(.type == "operating-system")
                 | select(.properties | map(select(.name == "syft:distro:id")) | length == 1)' "$cdx" >/dev/null \
            || { echo "FAIL: CycloneDX carries no operating-system component" >&2; exit 1; }

          # The sidecar, with the documented column contract.
          sidecar="$(ls /tmp/svc/*-services.csv | head -1)"
          want='hostname,machine_id,os_id,os_version_id,architecture,scanned_at,endpoints,pid,executable,command,unit,container,user,socket_activated,components,confidence,evidence,processes,published_as'
          got="$(head -1 "$sidecar")"
          test "$got" = "$want" || { echo "FAIL: services CSV header drifted"; echo "got:  $got"; echo "want: $want"; exit 1; }
          test "$(wc -l < "$sidecar")" -gt 1

          # --no-service-command keeps the section and drops only argv, which
          # is what SECURITY.md promises.
          run /tmp/svc-nocmd --no-service-command
          nocmd="$(ls /tmp/svc-nocmd/*.json | head -1)"
          test "$(jq '[.services[] | select(.command != null)] | length' "$nocmd")" = "0"
          test "$(jq '.services | length' "$nocmd")" -gt 0

          # --no-services drops the section and writes no sidecar at all.
          run /tmp/svc-off --no-services
          off="$(ls /tmp/svc-off/*.json | head -1)"
          test "$(jq -r '.services // "absent"' "$off")" = "absent"
          test -z "$(ls /tmp/svc-off/*-services.csv 2>/dev/null || true)"

          echo "OK: services collected, attributed, and both opt-outs honoured"

          # --- the network edge ---------------------------------------------
          test "$(jq -r .scan.firewall_examined "$report")" = "false"
          jq -e '.scan.exposure_blind_spots | index("netfilter-dnat-not-read")' "$report" >/dev/null
          jq -e '.scan.exposure_blind_spots | index("firewall-rules-not-read")' "$report" >/dev/null

          echo "--- exposure ---"
          jq -r '.exposure[] | [.bind_scope, "\(.address):\(.port)/\(.protocol)", .confidence] | @tsv' "$report"

          # The listener we started is bound to loopback and must say so. A
          # scope of "wildcard" here would be a materially different finding
          # about the same socket.
          scope="$(jq -r '.exposure[] | select(.port == 39999) | .bind_scope' "$report" | head -1)"
          test "$scope" = "loopback" || { echo "FAIL: 127.0.0.1:39999 bind_scope = '$scope'" >&2; exit 1; }

          # Every exposure row must carry a bind_scope, and none may claim a
          # vocabulary that implies reachability.
          test "$(jq '[.exposure[] | select(.bind_scope == null)] | length' "$report")" = "0"
          if jq -e '[.exposure[] | select(.bind_scope == "public" or .bind_scope == "private")] | length > 0' "$report" >/dev/null; then
            echo "FAIL: a bind_scope claimed reachability swinv cannot observe" >&2
            exit 1
          fi

          # A container's listener must never reach the host exposure list.
          # 8080, not 80: the unprivileged image serves there, and publishing
          # a port nothing listens on would test the failure path instead.
          docker run -d --rm --name swinv-ci-nginx --network bridge -p 127.0.0.1:38080:8080 \
            nginxinc/nginx-unprivileged:1.27-alpine >/dev/null
          # Also one that publishes nothing, whose ports must stay out of exposure[].
          docker run -d --rm --name swinv-ci-private nginxinc/nginx-unprivileged:1.27-alpine >/dev/null
          sleep 5

          run /tmp/svc-ctr
          ctr="$(ls /tmp/svc-ctr/*.json | head -1)"

          echo "--- containers ---"
          jq -r '.containers[] | [.id[0:12], (.name // "-"), "\(.os_id)-\(.os_version_id)", (.image.ref // "-")] | @tsv' "$ctr"
          echo "--- container services ---"
          jq -r '.containers[] | .id[0:12] as $i | .services[] | [$i, .executable, .confidence, ((.components // ["-"]) | join(","))] | @tsv' "$ctr"

          # The identity that makes this useful: the container's own package
          # database, not the image reference, which no matcher resolves.
          owner="$(jq -r '.containers[] | .services[] | select(.executable | test("nginx")) | (.components // [])[0]' "$ctr" | head -1)"
          case "$owner" in
            pkg:apk/alpine/nginx@*) echo "OK: containerised nginx -> $owner" ;;
            *) echo "FAIL: containerised nginx attributed to '$owner'," >&2
               echo "      want the apk from the container's own database." >&2
               exit 1 ;;
          esac

          # The published port resolves through the forwarder to that package,
          # and never to the package that ships docker-proxy.
          jq -e '.exposure[] | select(.port == 38080)
                 | select((.components // [])[0] | startswith("pkg:apk/alpine/nginx"))' "$ctr" >/dev/null \
            || { echo "FAIL: published port 38080 did not resolve to the container's nginx" >&2
                 jq '.exposure[] | select(.port == 38080)' "$ctr" >&2; exit 1; }
          if jq -e '.exposure[] | select(.port == 38080) | select((.components // []) | map(test("docker-ce")) | any)' "$ctr" >/dev/null; then
            echo "FAIL: a published port was attributed to the package that ships docker-proxy" >&2
            exit 1
          fi

          # The unpublished container listens on 8080 inside its own namespace.
          # That must appear under containers[] and never in exposure[].
          jq -e '.containers[] | .services[] | select((.endpoints // []) | map(test(":8080/")) | any)' "$ctr" >/dev/null
          if jq -e '[.exposure[] | select(.port == 8080)] | length > 0' "$ctr" >/dev/null; then
            echo "FAIL: a container-namespace listener appeared in the host exposure list" >&2
            exit 1
          fi

          # Container packages join the inventory, marked with the scope they
          # were found at, so CVE tooling reading components[] sees them.
          jq -e '.components[] | select(.root | startswith("container:"))
                 | select(.attributes.scan_scope == "listening-executables-only")' "$ctr" >/dev/null

          # The exposure sidecar and its column contract.
          exposure_csv="$(ls /tmp/svc-ctr/*-exposure.csv | head -1)"
          want='hostname,machine_id,os_id,os_version_id,architecture,scanned_at,address,port,protocol,family,bind_scope,wildcard_covers_ipv4,pid,executable,unit,user,container,backend_address,backend_port,backend_container,backend_executable,backend_via,image_ref,image_manifest_digest,components,confidence,evidence,ran_as_root,firewall_examined,exposure_blind_spots'
          got="$(head -1 "$exposure_csv")"
          test "$got" = "$want" || { echo "FAIL: exposure CSV header drifted"; echo "got:  $got"; echo "want: $want"; exit 1; }

          # --no-containers keeps the exposure list and drops the identities.
          run /tmp/svc-noctr --no-containers
          noctr="$(ls /tmp/svc-noctr/*.json | head -1)"
          test "$(jq -r '.containers // "absent"' "$noctr")" = "absent"
          test "$(jq '.exposure | length' "$noctr")" -gt 0

          docker rm -f swinv-ci-nginx swinv-ci-private >/dev/null 2>&1 || true
          echo "OK: exposure classified, containers identified, blind spots declared"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: swinv-linux-amd64
          path: bin/swinv
          if-no-files-found: error
          retention-days: 7

  cross-distro:
    name: cross-distro package catalogers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the static binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/swinv ./cmd/swinv

      # Each distribution's own tooling is the oracle. A Syft upgrade that
      # quietly stops reading one package database shows up here as a count
      # mismatch rather than as a silently thinner inventory months later.
      - name: Compare against each distribution's package manager
        run: |
          set -u
          fail=0
          check() {
            local name="$1" image="$2" nativecmd="$3"
            local native swinv
            native=$(docker run --rm "$image" sh -c "$nativecmd" 2>/dev/null | tr -d '[:space:]')
            if ! docker run --rm -v /tmp/swinv:/swinv:ro -v /tmp/out:/out "$image" \
                 /swinv --root / --out /out --quiet --format json --offline \
                 --catalogers os --name "$name" >/dev/null 2>&1; then
              echo "::error::$name: swinv failed to run"; fail=1; return
            fi
            swinv=$(python3 -c "import json;print(len(json.load(open('/tmp/out/$name.json'))['components']))")
            if [ "$native" = "$swinv" ]; then
              echo "  $name: $swinv == $native"
            else
              echo "::error::$name: swinv found $swinv, $image reports $native"
              fail=1
            fi
          }
          mkdir -p /tmp/out
          check alpine    alpine:latest        'apk info 2>/dev/null | wc -l'
          check debian    debian:stable-slim   'dpkg-query -f ".\n" -W 2>/dev/null | wc -l'
          check fedora    fedora:latest        'rpm -qa 2>/dev/null | wc -l'
          check arch      archlinux:latest     'pacman -Q 2>/dev/null | wc -l'
          check opensuse  opensuse/tumbleweed  'rpm -qa 2>/dev/null | wc -l'
          exit $fail

  arm64-smoke:
    name: arm64 under emulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Register arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and run the arm64 binary
        run: |
          set -eu
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/swinv-arm64 ./cmd/swinv
          mkdir -p /tmp/out
          docker run --rm --platform linux/arm64 -v /tmp/swinv-arm64:/swinv:ro \
            alpine:latest /swinv --version
          # Not just --version: prove it actually catalogues on arm64.
          docker run --rm --platform linux/arm64 -v /tmp/swinv-arm64:/swinv:ro \
            -v /tmp/out:/out alpine:latest \
            /swinv --root / --out /out --quiet --format json --offline --catalogers os --name arm64
          native=$(docker run --rm --platform linux/arm64 alpine:latest sh -c 'apk info | wc -l' | tr -d '[:space:]')
          found=$(python3 -c "import json;print(len(json.load(open('/tmp/out/arm64.json'))['components']))")
          arch=$(python3 -c "import json;print(json.load(open('/tmp/out/arm64.json'))['host']['architecture'])")
          echo "  arm64: swinv=$found apk=$native arch=$arch"
          [ "$found" = "$native" ] || { echo "::error::arm64 count mismatch"; exit 1; }
          [ "$arch" = "arm64" ] || { echo "::error::architecture reported as $arch"; exit 1; }

  windows-cross:
    name: windows cross-compile (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # There is no Windows collector yet -- see docs/WINDOWS.md. This job
      # exists so the claim that docs makes, that the tree already builds for
      # Windows unchanged, keeps being true: a Linux-only syscall or an
      # unguarded /proc read fails here instead of surfacing months later when
      # someone starts the port.
      - name: Build and vet for windows/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -eu
          go vet ./...
          go build -trimpath \
            -ldflags "-s -w -X main.version=$(git describe --tags --always)-windows-experimental \
                      -X main.commit=$(git rev-parse HEAD)" \
            -o swinv.exe ./cmd/swinv
          ls -l swinv.exe

      # Published so the binary can be exercised on a real Windows machine to
      # establish a baseline. Deliberately a CI artifact and not a release
      # asset: on Windows this binary reports host facts it cannot determine
      # and applies none of the Linux exclusion model, so it is a measuring
      # instrument, not something anyone should install.
      - name: Upload the experimental binary
        uses: actions/upload-artifact@v7
        with:
          name: swinv-windows-amd64-experimental
          path: swinv.exe
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: windows (native runner)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "Confirm the runner is elevated and C: is NTFS"
        shell: pwsh
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          $fs = (Get-Volume -DriveLetter C).FileSystemType
          "elevated: $elevated"
          "C: filesystem: $fs"
          # MFT enumeration needs both. Failing here rather than inside the
          # tests makes a runner-image change diagnosable in one line.
          if (-not $elevated) { throw "runner is not elevated; FSCTL_ENUM_USN_DATA will fail" }
          if ($fs -ne "NTFS")  { throw "C: is $fs, not NTFS; there is no MFT to enumerate" }

      # The gate. This is the code written specifically for Windows, and it is
      # the reason this job exists: the record parser and path reconstruction
      # can be tested anywhere, but FSCTL_ENUM_USN_DATA against a real MFT
      # cannot be tested anywhere else.
      - name: Test the MFT enumerator against a real volume
        run: go test ./internal/usn/... -v -count=1

      # The Windows help page is a separate document from the Linux one, and
      # nothing on a Linux runner can check it. It drifted to 91 lines once
      # already: the test caught it, but only in the informational step below,
      # so CI stayed green. Gate it here.
      - name: Check the Windows help page
        run: go test ./cmd/swinv/ -run "TestHelp" -v -count=1

      # End to end: does the Windows collector actually produce an inventory?
      # Everything above tests components in isolation; this is the only step
      # that runs the binary the way an operator would.
      - name: Collect a real inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go build -o swinv.exe ./cmd/swinv
          New-Item -ItemType Directory -Force -Path inv | Out-Null

          # Registry only: fast, needs no elevation, and covers machine-wide
          # installed software.
          .\swinv.exe --out inv --offline --verbose --timeout 5m

          $file = Get-ChildItem inv\*.json | Select-Object -Last 1
          $r = Get-Content $file -Raw | ConvertFrom-Json
          "schema:     $($r.schema_version)"
          "components: $($r.components.Count)"
          $r.components | Group-Object found_by | ForEach-Object { "  $($_.Count)  $($_.Name)" }
          $r.components | Group-Object type | ForEach-Object { "  $($_.Count)  type=$($_.Name)" }
          $r.components | Select-Object -First 5 name, version, vendor, type | Format-Table

          # Store apps and Windows updates are registry reads, so they must be
          # present in the default run, not only under --full-scan.
          $msix = ($r.components | Where-Object { $_.type -eq "msix" }).Count
          $kb   = ($r.components | Where-Object { $_.type -eq "hotfix" }).Count
          "msix packages: $msix"
          "windows updates: $kb"
          if ($msix -eq 0) { throw "no Store or MSIX packages found" }
          if ($kb -eq 0) { throw "no Windows updates found in the component store" }

          # The cumulative update's package version is the host's build and
          # UBR. If those ever disagree, either the state filter is wrong or
          # the wrong RollupFix package was chosen -- the store holds a staged
          # checkpoint baseline alongside the installed one.
          $lcu = $r.components | Where-Object { $_.attributes.servicing_stream -eq "cumulative" }
          if (-not $lcu) { throw "no cumulative update found" }
          $want = "$((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild)." +
                  "$((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR)"
          if ($lcu.version -ne $want) {
            throw "cumulative update version '$($lcu.version)' does not match the host build '$want'"
          }
          "cumulative update $($lcu.version) matches the host build"

          # Without a PURL, a CPE is the only identifier a Windows component
          # carries. With neither, a CycloneDX document from this host matches
          # nothing in any scanner and looks like a clean result.
          $withCpe = ($r.components | Where-Object { $_.cpes }).Count
          "components with a CPE: $withCpe of $($r.components.Count)"
          $r.components | Where-Object { $_.cpes } | Select-Object -First 3 name, @{n='cpe';e={$_.cpes[0]}} | Format-Table
          if ($withCpe -eq 0) { throw "no component carries a CPE; nothing can be matched against a vulnerability feed" }
          $r.components | Where-Object { $_.type -eq "msix" } | Select-Object -First 5 name, version | Format-Table
          $r.components | Where-Object { $_.type -eq "hotfix" } | Select-Object -First 5 name | Format-Table

          if ($r.components.Count -lt 5) {
            throw "only $($r.components.Count) components: the registry cataloger found essentially nothing"
          }
          $withVersion = ($r.components | Where-Object { $_.version }).Count
          "with a version: $withVersion of $($r.components.Count)"
          if ($withVersion -eq 0) { throw "no component carries a version" }
          $withVendor = ($r.components | Where-Object { $_.vendor }).Count
          "with a vendor:  $withVendor of $($r.components.Count)"

          # The host block. Without it a Windows report cannot be grouped by OS
          # or joined to a fleet dataset on a stable identity, which is what
          # kept the Windows binary out of a release.
          "--- host ---"
          $r.host | Format-List
          foreach ($f in "hostname","os_id","os_version_id","os_pretty_name","machine_id","architecture","kernel_release") {
            if (-not $r.host.$f) { throw "host.$f is empty" }
          }
          if ($r.host.os_id -ne "windows") { throw "host.os_id is '$($r.host.os_id)', want 'windows'" }
          if ($r.host.machine_id -notmatch '^[0-9a-f]{32}$') {
            throw "host.machine_id '$($r.host.machine_id)' is not 32 hex characters"
          }
          # Two traps at once. The registry claims "Windows 10" on Windows 11
          # hosts, so the build number is what distinguishes clients. And
          # client and server share builds -- Windows 11 24H2 and Server 2025
          # are both 26100 -- so a server must report its release year rather
          # than a client major. This runner is a server, which is how that
          # second one was found.
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          if ($cv.InstallationType -like "Server*") {
            if ($cv.ProductName -match '\b(20[0-2][0-9])(\s+R2)?\b') { $want = $Matches[0] }
            else { $want = $r.host.os_version_id }
          } elseif ([int]$cv.CurrentBuild -ge 22000) { $want = "11" } else { $want = "10" }

          if ($r.host.os_version_id -ne $want) {
            throw "os_version_id is '$($r.host.os_version_id)' but $($cv.InstallationType) build $($cv.CurrentBuild) means '$want'"
          }
          "os_version_id '$($r.host.os_version_id)' confirmed: $($cv.InstallationType), build $($cv.CurrentBuild)"

      - name: Collect with --full-scan
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path inv-full | Out-Null
          .\swinv.exe --out inv-full --offline --verbose --full-scan --timeout 12m

          $file = Get-ChildItem inv-full\*.json | Select-Object -Last 1
          $r = Get-Content $file -Raw | ConvertFrom-Json
          "components: $($r.components.Count)"
          $r.components | Group-Object found_by | ForEach-Object { "  $($_.Count)  $($_.Name)" }
          $r.scan.warnings | ForEach-Object { "warning: $_" }

          $pe = ($r.components | Where-Object { $_.found_by -eq "windows-pe-cataloger" }).Count
          if ($pe -eq 0) { throw "--full-scan extracted nothing from any executable" }

          # Language ecosystems. A hosted runner ships Python and Node, so
          # finding none means discovery or parsing is broken rather than that
          # the machine is bare.
          $lang = $r.components | Where-Object { $_.found_by -eq "language-manifest-cataloger" }
          "language packages: $($lang.Count)"
          $lang | Group-Object type | ForEach-Object { "  $($_.Count)  $($_.Name)" }
          $lang | Select-Object -First 6 name, version, type, purl | Format-Table
          if ($lang.Count -eq 0) { throw "no language-ecosystem packages found" }
          if (($lang | Where-Object { -not $_.purl }).Count -gt 0) {
            throw "a language package has no purl; these ecosystems have canonical PURL types"
          }
          $r.components |
            Where-Object { $_.found_by -eq "windows-pe-cataloger" -and $_.vendor } |
            Select-Object -First 8 name, version, vendor | Format-Table

      # Informational. Most of the suite was written for Linux and assumes
      # /proc and /etc; this records what does and does not survive on Windows
      # without holding the build hostage to it.
      - name: Whole suite (informational, not a gate)
        continue-on-error: true
        run: go test ./... -count=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

  licenses:
    name: licence gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Hard requirement from spec section 3: linking GPL/AGPL/LGPL code into
      # swinv would relicense the whole binary. This step is what stops the
      # licence position from drifting, so it must fail the build.
      - name: Fail on GPL / AGPL / LGPL / unknown dependencies
        run: make license-check

      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: make licenses

      - name: Fail if THIRD_PARTY_LICENSES.md is out of date
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md is stale." >&2
            echo "Run 'make licenses' and commit the result." >&2
            git --no-pager diff -- THIRD_PARTY_LICENSES.md >&2
            exit 1
          fi
          echo "OK: THIRD_PARTY_LICENSES.md is current"

      - name: Upload licence inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licence-inventory
          path: |
            bin/licenses.csv
            THIRD_PARTY_LICENSES.md
          if-no-files-found: ignore
          retention-days: 7

  packaging:
    name: systemd units
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Verify unit files
        run: |
          # systemd-analyze complains that the binary and the man page are not
          # installed on the runner; those messages are expected and filtered
          # out. Anything else is a real syntax error. The path is matched
          # loosely so a future move of the binary does not silently turn an
          # expected message into a CI failure.
          set -o pipefail
          out="$(systemd-analyze verify ./packaging/swinv.service ./packaging/swinv.timer 2>&1 || true)"
          echo "$out"
          filtered="$(printf '%s\n' "$out" \
            | grep -v 'is not executable: No such file or directory' \
            | grep -v "Command 'man swinv(8)' failed" \
            | grep -v 'has been removed and it is ignored' \
            | grep -v '^[[:space:]]*$' || true)"
          if [ -n "$filtered" ]; then
            echo "FAIL: systemd-analyze reported problems:" >&2
            printf '%s\n' "$filtered" >&2
            exit 1
          fi
          echo "OK: unit files verify cleanly"

      - name: Check the man page renders
        run: |
          set -eu
          # groff-base ships on the standard runner image, so do not reach for
          # apt unless it is genuinely missing. This step once hung for 21
          # minutes on "apt-get update" while unattended-upgrades held the dpkg
          # lock, and would have run to the 6-hour default without a timeout.
          if ! command -v groff >/dev/null 2>&1; then
            sudo apt-get update -qq -o DPkg::Lock::Timeout=120
            sudo apt-get install -y -qq -o DPkg::Lock::Timeout=120 groff-base
          fi
          # < /dev/null so a malformed macro can never leave groff waiting on
          # input; timeout so this step fails rather than stalls.
          timeout 60 groff -mandoc -Tutf8 packaging/swinv.8 > /dev/null < /dev/null
          echo "OK: packaging/swinv.8 renders"

# Cuts a release when a v* tag is pushed.
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# Produces, for linux/amd64 and linux/arm64:
#   swinv-<version>-linux-<arch>       static binaries
#   swinv-<version>-windows-amd64.exe  static binary, experimental
#   swinv_<version>-1_<arch>.deb       Debian/Ubuntu packages
#   swinv-<version>-1.<rpmarch>.rpm    RHEL/Fedora/SUSE packages
#   SHA256SUMS                         checksums over all of the above
#
# The full CI suite is re-run first: a tag must never ship something that
# would have failed a pull request.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v1.0.0). Produces artefacts only, no GitHub release."
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  verify:
    name: verify before shipping
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build, vet and test
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          CGO_ENABLED=1 go test -race ./...

      - name: Licence gate
        run: make license-check

  release:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # required to create the release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          # `make release` stamps the version from `git describe`.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install nfpm
        # Pinned, and kept in step with the NFPM_VERSION fallback in the
        # Makefile: an unpinned build tool can change what ships in a package
        # between two builds of the same tag.
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      # Untrusted input is passed through the environment, never interpolated
      # into the shell, and is validated before it reaches make/nfpm.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "::error::version must look like v1.2.3, got '$VERSION'"; exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::refusing unsafe version string '$VERSION'"
            exit 1
          fi
          # Package filenames drop the leading "v" (rpm rejects it), so the
          # install instructions in the release notes must use that form or
          # they name files that do not exist.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgversion=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries and packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release VERSION="$VERSION"

      - name: Verify the shipped binary is static
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # A dynamically linked artefact would break the "scp it anywhere"
          # promise, so fail the release rather than publish one.
          BIN="dist/swinv-$VERSION-linux-amd64"
          if ldd "$BIN" 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::amd64 binary is dynamically linked"
            ldd "$BIN" || true
            exit 1
          fi
          echo "amd64 binary is statically linked"

      - name: Smoke-test the amd64 binary and the deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          "./dist/swinv-$VERSION-linux-amd64" --version
          sudo dpkg -i dist/swinv_*_amd64.deb
          swinv --version
          test -f /usr/lib/systemd/system/swinv.timer
          test -f /usr/share/man/man8/swinv.8.gz
          # A real scan of a fixture tree, end to end.
          swinv --root testdata/rootfs --out /tmp/smoke --format json,csv
          # The glob matches the dated file AND the -latest symlink, so a bare
          # "test -s /tmp/smoke/*.json" gets three arguments and exits 2.
          # Check each match, and require that there was at least one.
          found=0
          for f in /tmp/smoke/*.json; do
            test -s "$f"
            found=$((found + 1))
          done
          test "$found" -gt 0
          sudo dpkg --purge swinv

      - name: Verify the rpm payload
        run: |
          set -e
          # Bound the dpkg lock wait: unattended-upgrades on the runner can
          # otherwise hold it long enough to stall the whole release.
          if ! command -v rpm >/dev/null 2>&1; then
            sudo apt-get update -qq -o DPkg::Lock::Timeout=120
            sudo apt-get install -y -qq -o DPkg::Lock::Timeout=120 rpm
          fi
          rpm -qip dist/swinv-*.x86_64.rpm
          rpm -qlp dist/swinv-*.x86_64.rpm

      - name: Checksums
        run: cat dist/SHA256SUMS

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: swinv-${{ steps.version.outputs.version }}
          path: |
            dist/swinv-*-linux-*
            dist/swinv-linux-*
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push'
        # Pinned to a SHA, not the mutable v2 tag: this step runs with
        # contents:write, so a compromised or retagged action could publish
        # arbitrary assets under our release.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true          # review the notes before it goes public
          generate_release_notes: true
          files: |
            dist/swinv-*-linux-*
            dist/swinv-linux-*
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          body: |
            ## Install

            Debian / Ubuntu:
            ```sh
            sudo dpkg -i swinv_${{ steps.version.outputs.pkgversion }}-1_amd64.deb
            ```

            RHEL / Fedora / SUSE:
            ```sh
            sudo rpm -i swinv-${{ steps.version.outputs.pkgversion }}-1.x86_64.rpm
            ```

            Or just drop the static binary somewhere on `PATH`:
            ```sh
            install -m0755 swinv-${{ steps.version.outputs.version }}-linux-amd64 /usr/bin/swinv
            ```

            The daily timer is shipped but **not** enabled on install. Turn it on with
            `systemctl enable --now swinv.timer`.

            Verify downloads against `SHA256SUMS`.
